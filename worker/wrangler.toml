name = "event-radar-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put`): TURSO_DATABASE_URL, TURSO_AUTH_TOKEN,
# TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, and optionally TELEGRAM_CHAT_ID.

# Daily auto-digest at 08:00 UTC (~10:00 Rome); no-op unless TELEGRAM_CHAT_ID set.
[triggers]
crons = ["0 8 * * *"]

[vars]
PUSH_THRESHOLD = "35"
DIGEST_SIZE = "10"
