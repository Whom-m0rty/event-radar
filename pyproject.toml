[project]
name = "event-radar"
version = "0.1.0"
description = "Personal aggregator of electronic events in Milan: fetch, score by taste, push to a shared Google Calendar, collect feedback."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "requests-cache>=1.2",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "python-telegram-bot[job-queue]>=21",
    "libsql-experimental>=0.0.55",
]

[project.scripts]
event-radar = "event_radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["event_radar"]
